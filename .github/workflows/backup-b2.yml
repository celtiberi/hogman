# Off-site pen backups on Backblaze B2 as code (decisions D-48, D-23).
#   pull request touching deploy/backup-b2: run the tests (no secrets)
#   manual run on main: make sure the bucket exists with Object Lock and the
#     30-day lifecycle, from the locked "infra" environment (approval required).
#     With "new_keys", also create the server's write-only key and the
#     maintainer's restore key, each encrypted with age to its owner (public
#     keys from the infra environment's variables); they come out as a 1-day
#     artifact. Plain keys, bucket names and key IDs never appear in logs.
name: backup-b2

on:
  pull_request:
    paths: ["deploy/backup-b2/**", ".github/workflows/backup-b2.yml"]
  workflow_dispatch:
    inputs:
      new_keys:
        description: "Also create fresh server + maintainer keys (encrypted)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: backup-b2 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Test against a local fake of the B2 API
        run: python3 -I deploy/backup-b2/test_b2.py -v

  ensure:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    name: backup-b2 ensure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: infra                  # master key; waits for approval; main only
    concurrency: { group: backup-b2, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Ensure bucket (and keys if asked)
        env:
          B2_MASTER_KEY_ID: ${{ secrets.BLAZE_MASTER_APPLICATION_KEY_ID }}
          B2_MASTER_KEY: ${{ secrets.BLAZE_MASTER_APPLICATION_KEY }}
          # Public age keys, kept in the locked environment (not the repo) so a
          # pull request can't redirect a new key to someone else.
          B2_SERVER_RECIPIENT: ${{ vars.B2_SERVER_RECIPIENT }}
          B2_MAINTAINER_RECIPIENT: ${{ vars.B2_MAINTAINER_RECIPIENT }}
          NEW_KEYS: ${{ inputs.new_keys }}
        run: |
          set -euo pipefail
          args=(ensure --out "$RUNNER_TEMP/b2-keys")
          [ "$NEW_KEYS" = "true" ] && args+=(--new-keys)
          python3 -I deploy/backup-b2/b2.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand over the encrypted keys (1 day)
        if: inputs.new_keys
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b2-keys-encrypted
          path: ${{ runner.temp }}/b2-keys/*.age
          retention-days: 1
          if-no-files-found: error
