# End-to-end tests on GitHub's runners, so they don't need Docker on our own
# machines. Each suite raises real pens in Docker (Headscale, the registrar,
# Caddy, Tailscale clients) and plays out a pen's life against them.
name: e2e

# These checks are required on main, so they must always report. A change that
# touches only docs, Markdown, DNS records (infra/) or the DNS workflow runs
# the small "changes" job and skips the suites (a skipped job counts as passed).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The PR's own tip, not the merge commit checked out: that merge is
          # with today's main, which may have moved since BASE, and diffing it
          # against BASE would count other PRs' changes as this one's.
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          # Three dots: what changed on the branch since it left BASE.
          if [ -n "$BASE" ] && files="$(git diff --name-only "$BASE...$TIP" 2>/dev/null)"; then
            if ! grep -qvE '^(docs/|infra/)|^\.github/workflows/dns\.yml$|\.md$' <<<"$files"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  compose:
    name: public-certificate pen compose
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: core/test/compose-public-check.sh

  images:
    name: docker image builds
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build registrar image (isolated context + go test)
        run: docker build --progress=plain -t hogman-registrar-check core/registrar
      - name: Build signup images (isolated context + go test)
        run: |
          docker build --progress=plain --target web -t hogman-signup-web-check deploy/signup
          docker build --progress=plain --target broker -t hogman-signup-broker-check deploy/signup
      - name: Test join client in isolated Docker context
        run: docker build --progress=plain --target test -t hogman-join-test core/join
      - name: Validate changelog fragments
        run: |
          if [ -x deploy/changelog-fold.sh ]; then
            deploy/changelog-fold.sh --check
            deploy/test-changelog-fold.sh
          fi
      - name: Build Fleet Ops image and test snapshot collector
        run: |
          docker build --progress=plain -t hogman-ops-check deploy/ops
          deploy/test-ops-snapshot.sh

  pen-core:
    name: pen core (core/test/run.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
          dig -v 2>&1 | head -n 1
          openssl version
      # As root, like a real server: the pens' containers write root-only
      # folders (certificates, keys) into the bind-mounted data directory.
      - name: Run the pen suite
        run: sudo --preserve-env=PATH core/test/run.sh

  pen-acme:
    name: pen ACME (core/test/acme-pebble.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the ACME Pebble suite
        run: sudo --preserve-env=PATH core/test/acme-pebble.sh

  pen-sidecar:
    name: pen sidecar (core/test/sidecar-check.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the sealed sidecar check
        run: core/test/sidecar-check.sh

  # Required status check on main (keeps the exact existing check name while
  # running the three pen suites above in parallel).
  pen:
    name: pen (core/test/run.sh)
    needs: [changes, pen-core, pen-acme, pen-sidecar]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all pen suites passed
        env:
          CORE: ${{ needs.pen-core.result }}
          ACME: ${{ needs.pen-acme.result }}
          SIDECAR: ${{ needs.pen-sidecar.result }}
        run: |
          echo "pen-core=$CORE pen-acme=$ACME pen-sidecar=$SIDECAR"
          [ "$CORE" = "success" ] && [ "$ACME" = "success" ] && [ "$SIDECAR" = "success" ]

  host:
    name: shared host (deploy/test-host.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch previous release tag for legacy upgrade test
        run: git fetch --no-tags --depth=1 origin refs/tags/v2026.11.24-76d2903:refs/tags/v2026.11.24-76d2903
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
      - name: Run the shared-host suite
        run: sudo --preserve-env=PATH deploy/test-host.sh
