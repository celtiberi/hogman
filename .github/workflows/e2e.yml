# End-to-end tests on GitHub's runners, so they don't need Docker on our own
# machines. Each suite raises real pens in Docker (Headscale, the registrar,
# step-ca, Caddy, Tailscale clients) and plays out a pen's life against them.
name: e2e

# These checks are required on main, so they must always report. A change that
# touches only the website, docs or Markdown runs the small "changes" job and
# skips the suites (a skipped job counts as passed).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && files="$(git diff --name-only "$BASE" HEAD 2>/dev/null)"; then
            if ! grep -qvE '^(site/|docs/)|\.md$' <<<"$files"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  pen:
    name: pen (core/test/run.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
      # As root, like a real server: the pens' containers write root-only
      # folders (certificates, keys) into the bind-mounted data directory.
      - name: Run the pen suite
        run: sudo --preserve-env=PATH core/test/run.sh

  host:
    name: shared host (deploy/test-host.sh)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Tools
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          jq --version
      - name: Run the shared-host suite
        run: sudo --preserve-env=PATH deploy/test-host.sh
