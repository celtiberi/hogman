# Deploy hogman.network (site/) to Fly.io on merge to main.
#   pull request touching site/ or this workflow: check docs-src sync & Docker build
#   push to main touching site/ (or manual run): verify and preserve the live /dl/*
#     release bundles, then deploy site/ to Fly.io from the "site" environment (main only).
name: site-deploy

on:
  pull_request:
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLYCTL_VERSION: 0.5.14
  # sha256 of flyctl_<version>_Linux_x86_64.tar.gz, from flyctl_<version>_checksums.txt
  FLYCTL_SHA256: 0ff9abeae51ef2efe5eec13e260c2090a533f8250b1bed7094acdbc7b8e5a9a5

jobs:
  check:
    name: check site build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check docs-src matches site/public/docs
        run: |
          set -euo pipefail
          python3 site/docs-src/build.py
          git diff --exit-code site/public/docs/ || {
            echo "site/public/docs/ is out of sync with site/docs-src/. Run: python3 site/docs-src/build.py" >&2
            exit 1
          }
      - name: Check site Docker image builds
        run: docker build --quiet site >/dev/null

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    name: deploy hogman.network
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: site                   # app-scoped FLY_API_TOKEN; main only
    concurrency: { group: site-deploy, cancel-in-progress: false }
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                # needed to resolve & verify live release commit

      - name: Verify and preserve live /dl release bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/site/public/dl"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$out" "$tmp/bin" "$tmp/fetched-src" "$tmp/git-src"

          ver="$(curl -fsSL https://hogman.network/dl/latest | tr -d '\r\n')"
          [[ "$ver" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]] || {
            echo "unexpected /dl/latest version: $ver" >&2
            exit 1
          }
          printf '%s\n' "$ver" > "$out/latest"

          curl -fsSL https://hogman.network/dl/SHA256SUMS -o "$out/SHA256SUMS"
          tarball="hogman-$ver.tar.gz"
          bins="hogman-bin-$ver.tar.gz"
          want_files="$(printf '%s\n%s\n' "$bins" "$tarball" | sort)"
          got_files="$(awk '{print $2}' "$out/SHA256SUMS" | sort)"
          [ "$got_files" = "$want_files" ] || {
            echo "SHA256SUMS file list mismatch: got '$got_files', want '$want_files'" >&2
            exit 1
          }

          curl -fsSL "https://hogman.network/dl/$tarball" -o "$out/$tarball"
          curl -fsSL "https://hogman.network/dl/$bins" -o "$out/$bins"
          (cd "$out" && sha256sum -c SHA256SUMS)

          # Guard against path traversal before extracting fetched archives.
          for archive in "$out/$tarball" "$out/$bins"; do
            if tar -tzf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "unsafe path in archive $archive" >&2
              exit 1
            fi
          done

          # Non-circular verification: tie both tarballs back to this repository
          # so the workflow can never re-publish code or binaries our build didn't make.
          short="${ver##*-}"
          full="$(git rev-parse "${short}^{commit}")"

          tar --no-same-owner --no-same-permissions -xzf "$out/$tarball" -C "$tmp/fetched-src"
          # Keep this path list in sync with deploy/release.sh's git archive command.
          git archive --format=tar "$full" core deploy/hogman-host deploy/bootstrap.sh deploy/README.md deploy/signup deploy/challenge-dns LICENSE README.md \
            | tar -xf - -C "$tmp/git-src"
          diff -rq "$tmp/fetched-src" "$tmp/git-src"

          tar --no-same-owner --no-same-permissions -xzf "$out/$bins" -C "$tmp/bin"
          checked=0
          while IFS= read -r -d '' f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --deny-self-hosted-runners \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" --source-digest "$full" >/dev/null
            checked=$((checked + 1))
          done < <(find "$tmp/bin/prebuilt" -type f -print0)
          [ "$checked" -gt 0 ] || { echo "no prebuilt files found in $bins" >&2; exit 1; }
          echo "preserved verified release $ver ($checked attested binary files + source archive matched $full)"

      - name: Install flyctl (checksum pinned)
        run: |
          set -euo pipefail
          f="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$f" "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/$f"
          echo "$FLYCTL_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" flyctl && sudo install -m 0755 flyctl /usr/local/bin/flyctl

      - name: Deploy site to Fly.io
        working-directory: site
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "FLY_API_TOKEN is not set in the 'site' GitHub Actions environment." >&2
            echo "Create an app-scoped deploy token: fly tokens create deploy -a hogman" >&2
            exit 1
          fi
          # Re-check /dl/latest right before deploying so an overlapping deploy/release.sh
          # run can never be rolled back to an older /dl/ bundle.
          want="$(tr -d '\r\n' < public/dl/latest)"
          live_now="$(curl -fsSL https://hogman.network/dl/latest | tr -d '\r\n')"
          [ "$live_now" = "$want" ] || {
            echo "live /dl/latest changed from '$want' to '$live_now' during this run; aborting to avoid rolling back /dl/ (re-run site-deploy)" >&2
            exit 1
          }
          flyctl deploy --ha=false

      - name: Smoke test live site and /dl/latest
        run: |
          set -euo pipefail
          want="$(tr -d '\r\n' < site/public/dl/latest)"
          curl -fsSI https://hogman.network/ >/dev/null
          got="$(curl -fsSL https://hogman.network/dl/latest | tr -d '\r\n')"
          [ "$got" = "$want" ] || {
            echo "live /dl/latest mismatch after deploy: got '$got', want '$want'" >&2
            exit 1
          }
          echo "live: https://hogman.network/ (HTTP 200) and /dl/latest -> $got"
