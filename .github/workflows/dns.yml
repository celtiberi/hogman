# hogman.network's DNS as code (decision D-23), with dnscontrol.
#   pull request touching infra/dns: preview the changes (read-only token)
#   merge to main: apply them, from the locked "infra" environment (approval required)
#   manual run, action "import": print today's zone as dnscontrol config, to start from
name: dns

on:
  pull_request:
    paths: ["infra/dns/**", ".github/workflows/dns.yml"]
  push:
    branches: [main]
    paths: ["infra/dns/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "import (print the live zone as config) or preview"
        type: choice
        options: [import, preview]
        default: import

permissions:
  contents: read

env:
  DNSCONTROL_VERSION: 5.10.1
  # sha256 of dnscontrol_<version>_linux_amd64.tar.gz, from the release's checksums.txt
  DNSCONTROL_SHA256: bf4b97b10e1501d953c143bad4cfbda945261762ed4d8ae36515f739663aea5b

jobs:
  preview:
    # Fork PRs get no secrets, so they'd only fail: skip them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    name: dns preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: infra-preview          # read-only token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dnscontrol (checksum pinned)
        run: |
          f="dnscontrol_${DNSCONTROL_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$f" "https://github.com/StackExchange/dnscontrol/releases/download/v${DNSCONTROL_VERSION}/$f"
          echo "$DNSCONTROL_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" dnscontrol && sudo install -m 0755 dnscontrol /usr/local/bin/dnscontrol
      - name: Import the live zone
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'import'
        working-directory: infra/dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
        # The repo and its logs are public. Fine for DNS-only records, which are
        # public anyway; if any record is proxied, its origin address shows here.
        run: |
          set -euo pipefail
          dnscontrol get-zones --format=js cloudflare - hogman.network | tee zone.js
          { echo '### Live hogman.network zone'; echo '```js'; cat zone.js; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Preview
        if: github.event_name == 'pull_request' || inputs.action == 'preview'
        working-directory: infra/dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
        run: |
          set -euo pipefail
          dnscontrol check
          dnscontrol preview 2>&1 | tee preview.txt
          { echo '### DNS changes this PR would make'; echo '```'; cat preview.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    # Switched on (repository variable DNS_APPLY_ENABLED=true) only once the live
    # zone has been imported into dnsconfig.js and a preview shows no changes.
    if: github.event_name == 'push' && vars.DNS_APPLY_ENABLED == 'true'
    name: dns apply
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: infra                  # edit token; waits for approval; main only
    concurrency: { group: dns-apply, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dnscontrol (checksum pinned)
        run: |
          f="dnscontrol_${DNSCONTROL_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$f" "https://github.com/StackExchange/dnscontrol/releases/download/v${DNSCONTROL_VERSION}/$f"
          echo "$DNSCONTROL_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" dnscontrol && sudo install -m 0755 dnscontrol /usr/local/bin/dnscontrol
      - name: Apply
        working-directory: infra/dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_EDIT_TOKEN }}
        run: |
          set -euo pipefail
          dnscontrol check
          dnscontrol push 2>&1 | tee push.txt
          { echo '### DNS changes applied'; echo '```'; cat push.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
