# Known vulnerabilities in our Go code and its dependencies (govulncheck only
# reports ones our code can actually reach). Runs on every PR, on main, and
# weekly, so a new advisory against an old dependency shows up without a push.
name: vuln

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [core/join, core/registrar, deploy/signup, deploy/challenge-dns, deploy/ops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - name: govulncheck ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          case "$MODULE" in
            core/join|core/registrar) export GOFLAGS="-tags=ts_omit_peerapiserver" ;;
          esac
          "$(go env GOPATH)/bin/govulncheck" ./...
