# Compile Hogman's own programs for every commit on main (and on demand).
# Releases are built only here, never on a laptop (audit H5): release.yml runs
# deploy/release.sh, which downloads this artifact for the exact commit it
# releases and checks GitHub's signed build provenance for every file before
# publishing anything.
name: build

on:
  push:
    branches: [main]
  pull_request:   # only to check changes to the build itself
    paths: [".github/workflows/build.yml", "deploy/build-bins.sh", "core/join/Dockerfile"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests run in a separate read-only job with no OIDC or attestation
  # permissions so unmerged PR changes never hold signing capabilities.
  check-pr:
    name: check build (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile
        run: |
          full="$(git rev-parse 'HEAD^{commit}')"
          ver="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$full")-${full:0:7}"
          VERSION="$ver" deploy/build-bins.sh . prebuilt
      - name: Verify client version
        run: |
          full="$(git rev-parse 'HEAD^{commit}')"
          want="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$full")-${full:0:7}"
          chmod +x prebuilt/join/hogman-Linux-x86_64
          out="$(prebuilt/join/hogman-Linux-x86_64 --version)"
          echo "$out"
          got="$(printf '%s\n' "$out" | awk '{print $2}')"
          got="${got#v}"
          if [ -z "$got" ] || [ "$got" = "dev" ] || [ "$got" != "$want" ]; then
            echo "built client reported version '${got:-<empty>}', expected '$want'" >&2
            exit 1
          fi
      - name: List
        run: find prebuilt -type f | sort

  bins:
    name: compile (join tool, registrar, sign-up page)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # sign the provenance (Sigstore, keyless)
      attestations: write   # store it with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile
        run: |
          full="$(git rev-parse 'HEAD^{commit}')"
          ver="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$full")-${full:0:7}"
          VERSION="$ver" deploy/build-bins.sh . prebuilt
      - name: Verify client version
        run: |
          full="$(git rev-parse 'HEAD^{commit}')"
          want="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d "$full")-${full:0:7}"
          chmod +x prebuilt/join/hogman-Linux-x86_64
          out="$(prebuilt/join/hogman-Linux-x86_64 --version)"
          echo "$out"
          got="$(printf '%s\n' "$out" | awk '{print $2}')"
          got="${got#v}"
          if [ -z "$got" ] || [ "$got" = "dev" ] || [ "$got" != "$want" ]; then
            echo "built client reported version '${got:-<empty>}', expected '$want'" >&2
            exit 1
          fi
      - name: List
        run: find prebuilt -type f | sort
      # SLSA build provenance: which workflow, commit and runner made each file.
      # Anyone can check it with `gh attestation verify FILE --repo celtiberi/hogman`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "prebuilt/**/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hogman-bin-${{ github.sha }}
          path: prebuilt/
          retention-days: 30
          if-no-files-found: error
