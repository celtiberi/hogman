# Hogman core node. Do not run `docker compose up` directly the first time:
# use `./hogman up`, which bootstraps the mesh nodes and renders configs.

name: hogman

x-mesh-node: &mesh-node
  image: tailscale/tailscale:v1.104.7
  restart: unless-stopped
  cap_add: [NET_ADMIN, NET_RAW]
  devices: [/dev/net/tun:/dev/net/tun]
  mem_limit: 128m
  pids_limit: 128
  environment:
    GOGC: "25"
    GOMEMLIMIT: 96MiB
  networks: [core]
  depends_on: [edge]

services:
  # --- Public foothold: the only things reachable from the internet ---------

  headscale:
    image: headscale/headscale:0.29.7
    restart: unless-stopped
    command: serve
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    environment:
      GOGC: "25"
      GOMEMLIMIT: 180MiB
    tmpfs: [/var/run/headscale]
    volumes:
      - ./data/headscale/config:/etc/headscale:ro
      - ./data/headscale/lib:/var/lib/headscale
    ports:
      - "${STUN_PORT:-3478}:${STUN_PORT:-3478}/udp"   # STUN for the embedded relay (unique per pen on a shared host)
    networks: [core]
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 5s
      retries: 20

  edge:
    image: caddy:2.11.9
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      EDGE_TLS_MODE: ${EDGE_TLS_MODE:-}
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./config/edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/edge:/data
      - ./join-page:/srv/join-page:ro
      - ./data/join-dl:/srv/join-dl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      core:
        # Mesh nodes on this host reach the control server without hairpin NAT.
        aliases: ["${PUBLIC_HOST}"]
    depends_on:
      headscale: { condition: service_healthy }

  # --- Mesh identities for the core services --------------------------------

  core-mesh:            # mesh IP serves DNS, the portal (home.<zone>) and the CA (ca.<zone>:9000)
    <<: *mesh-node
    hostname: core
    # Allow unprivileged registrar (cap_drop: ALL) to bind UDP/TCP port 53 here.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=53
    env_file: [{ path: ./data/mesh/core.env, required: false }]
    volumes:
      - ./data/mesh/core:/var/lib/tailscale
      - ./data/edge-trust:/edge-trust:ro
    networks:
      core:
        # Core services reach the CA by its real name over the local network.
        aliases: ["ca.${ZONE}"]

  # --- Services living on those mesh IPs ------------------------------------

  portal:
    image: caddy:2.11.9
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    network_mode: service:core-mesh
    environment:
      ZONE: ${ZONE}
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./config/portal.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - ./data/pki/public:/pki:ro
      - ./data/portal:/data
    depends_on:
      registrar: { condition: service_started }
      step-ca: { condition: service_healthy }   # else the first cert request fails and Caddy backs off

  # The registrar: members, invites, devices, names, removal. Owns the access
  # policy (in Headscale) and serves authoritative DNS on :53 (UDP/TCP).
  #   public  :8081  invite redemption only, via edge/front door at https://<public host>/hogman/
  #   mesh    127.0.0.1:8082  member/admin API, via the portal at https://home.<zone>/api/
  registrar:
    build:
      context: ./registrar
      # Dockerfile.prebuilt when the release shipped a compiled registrar (see ./hogman).
      dockerfile: ${REGISTRAR_DOCKERFILE:-Dockerfile}
    image: hogman/registrar:dev
    restart: unless-stopped
    user: "${HOGMAN_UID:-1000}:${HOGMAN_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m
    pids_limit: 128
    network_mode: service:core-mesh
    environment:
      ZONE: ${ZONE}
      PUBLIC_HOST: ${PUBLIC_HOST}
      CORE_MESH_IP: ${CORE_MESH_IP:-}
      MEMBERS_CAN_INVITE: ${MEMBERS_CAN_INVITE:-false}
      NAME_HOLD: ${NAME_HOLD:-2160h}
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./data/registrar:/var/lib/registrar
      - ./data/secrets/registrar:/secrets:ro
      - ./data/pki/public:/pki:ro
    depends_on:
      headscale: { condition: service_healthy }

  step-ca:
    image: smallstep/step-ca:0.30.2
    restart: unless-stopped
    network_mode: service:core-mesh
    depends_on:
      registrar: { condition: service_started }
    user: "${HOGMAN_UID:-1000}:${HOGMAN_GID:-1000}"
    mem_limit: 128m
    pids_limit: 128
    environment:
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    entrypoint: ["step-ca"]
    command:
      - --password-file=/home/step/secrets/intermediate_password
      - --resolver=${CORE_MESH_IP:-127.0.0.1}:53
      - /home/step/config/ca.json
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://ca.${ZONE}:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      retries: 10
    volumes:
      - ./data/step/config:/home/step/config:ro
      - ./data/step/secrets:/home/step/secrets:ro
      - ./data/pki/public:/home/step/certs:ro
      - ./data/step/db:/home/step/db
      # Look names up in the pen's own DNS. step-ca's --resolver covers some
      # ACME checks but not TLS-ALPN, which otherwise asks Docker's DNS, finds
      # nothing for <name>.<zone>, and fails every member's first try.
      - ./config/step-resolv.conf:/etc/resolv.conf:ro

networks:
  core: {}
