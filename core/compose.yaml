# Hogman core node. Do not run `docker compose up` directly the first time:
# use `./hogman up`, which bootstraps the mesh nodes and renders configs.

name: hogman

x-mesh-node: &mesh-node
  image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
  restart: unless-stopped
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, NET_RAW, CHOWN, DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]
  devices: [/dev/net/tun:/dev/net/tun]
  cpus: 0.25
  cpu_shares: 256
  mem_limit: 128m
  pids_limit: 128
  environment:
    GOGC: "25"
    GOMEMLIMIT: 96MiB
  networks: [core]
  depends_on: [edge]

services:
  # --- Public foothold: the only things reachable from the internet ---------

  headscale:
    image: headscale/headscale:0.29.7@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    restart: unless-stopped
    user: "${HOGMAN_UID:-1000}:${HOGMAN_GID:-1000}"
    command: serve
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    cpu_shares: 256
    mem_limit: 256m
    pids_limit: 128
    environment:
      GOGC: "25"
      GOMEMLIMIT: 180MiB
    tmpfs:
      - /var/run/headscale:uid=${HOGMAN_UID:-1000},gid=${HOGMAN_GID:-1000},mode=0700
      - /tmp:uid=${HOGMAN_UID:-1000},gid=${HOGMAN_GID:-1000},mode=0700
    volumes:
      - ./data/headscale/config:/etc/headscale:ro
      - ./data/headscale/lib:/var/lib/headscale
    ports:
      - "${STUN_PORT:-3478}:${STUN_PORT:-3478}/udp"   # STUN for the embedded relay (unique per pen on a shared host)
    networks: [core]
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 5s
      retries: 20

  edge:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    user: "${HOGMAN_UID:-1000}:${HOGMAN_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Allow unprivileged Caddy (cap_drop: ALL) to bind HTTP/HTTPS ports 80/443.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=80
    cpus: 0.5
    cpu_shares: 256
    mem_limit: 128m
    pids_limit: 128
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      EDGE_TLS_MODE: ${EDGE_TLS_MODE:-}
      XDG_CONFIG_HOME: /tmp/caddy-config
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./config/edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/edge:/data
      - ./join-page:/srv/join-page:ro
      - ./data/join-dl:/srv/join-dl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      core:
        # Mesh nodes on this host reach the control server without hairpin NAT.
        aliases: ["${PUBLIC_HOST}"]
    depends_on:
      headscale: { condition: service_healthy }

  # --- Mesh identities for the core services --------------------------------

  core-mesh:            # mesh IP serves DNS and the portal (home.<zone>)
    <<: *mesh-node
    hostname: core
    # Allow unprivileged registrar (cap_drop: ALL) to bind UDP/TCP port 53 here.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=53
    env_file: [{ path: ./data/mesh/core.env, required: false }]
    volumes:
      - ./data/mesh/core:/var/lib/tailscale
      - ./data/edge-trust:/edge-trust:ro
    networks: [core]

  # --- Services living on those mesh IPs ------------------------------------

  portal:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    user: "${HOGMAN_UID:-1000}:${HOGMAN_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    cpu_shares: 256
    mem_limit: 128m
    pids_limit: 128
    network_mode: service:core-mesh
    environment:
      ZONE: ${ZONE}
      XDG_CONFIG_HOME: /tmp/caddy-config
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./config/portal.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./portal:/srv/portal:ro
      - ./data/portal:/data
      - ./data/home-tls:/home-tls:ro
      - ./data/caddy-admin:/run/caddy-admin
      - ./data/api:/run/hogman-api:ro   # the registrar's API socket (audit H2)
    depends_on:
      registrar: { condition: service_healthy }   # home.<zone>'s certificate exists

  # The registrar: members, invites, devices, names, removal. Owns the access
  # policy (in Headscale) and serves authoritative DNS on :53 (UDP/TCP).
  #   public  :8081  invite redemption only, via edge/front door at https://<public host>/hogman/
  #   mesh    unix socket in data/api (mounted only here and in the portal):
  #           member/admin API, via the portal at https://home.<zone>/api/
  registrar:
    build:
      context: ./registrar
      # Dockerfile.prebuilt when the release shipped a compiled registrar (see ./hogman).
      dockerfile: ${REGISTRAR_DOCKERFILE:-Dockerfile}
    image: hogman/registrar:dev
    restart: unless-stopped
    user: "${HOGMAN_UID:-1000}:${HOGMAN_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    cpu_shares: 256
    mem_limit: 128m
    pids_limit: 128
    network_mode: service:core-mesh
    environment:
      ZONE: ${ZONE}
      PUBLIC_HOST: ${PUBLIC_HOST}
      CORE_MESH_IP: ${CORE_MESH_IP:-}
      THEME: ${THEME:-}
      MEMBERS_CAN_INVITE: ${MEMBERS_CAN_INVITE:-false}
      MESH_ADDR: unix:/run/hogman-api/mesh.sock
      CHALLENGE_DNS_URL: unix:///run/hogman-acme/api.sock
      CHALLENGE_DNS_TOKEN_FILE: /secrets/challenge_dns_token
      HOME_TLS_DIR: /home-tls
      CADDY_ADMIN_SOCKET: /run/caddy-admin/admin.sock
      ACME_STORAGE_DIR: /var/lib/registrar/acme
      ACME_CA_URL: ${ACME_CA_URL:-https://acme-v02.api.letsencrypt.org/directory}
      ACME_FALLBACK_CA_URL: ${ACME_FALLBACK_CA_URL:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_RESOLVERS: ${ACME_RESOLVERS:-1.1.1.1:53,8.8.8.8:53}
      GOGC: "25"
      GOMEMLIMIT: 96MiB
    volumes:
      - ./data/registrar:/var/lib/registrar
      - ./data/api:/run/hogman-api   # its API socket: shared with the portal only
      - ./data/home-tls:/home-tls    # home.<zone>'s certificate, for the portal
      - ./data/caddy-admin:/run/caddy-admin:ro     # the portal's admin socket, to reload on renewal
      - ./data/secrets/registrar:/secrets:ro
      - ${HOGMAN_ACME_SOCK_DIR:-/run/hogman-acme}:/run/hogman-acme:ro   # the host's challenge DNS API
    healthcheck:
      test: ["CMD", "registrar", "health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    depends_on:
      headscale: { condition: service_healthy }

networks:
  core: {}
