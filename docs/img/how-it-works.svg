<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="how-title how-desc">
  <style>
    svg { background: #1a0f16; }
    text { font: 16px "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif; fill: #f3e6d3; }
    .pen { fill: #2a1a24; stroke: #ffc233; stroke-width: 3; stroke-dasharray: 14 8; }
    .pen-label, .name { font-family: Impact, "Arial Narrow Bold", "Franklin Gothic Heavy", sans-serif; letter-spacing: 0.04em; }
    .pen-label { font-size: 26px; fill: #ffc233; }
    .name { font-size: 21px; }
    .box { fill: #140c11; stroke: #6a5560; stroke-width: 1.5; }
    .home { stroke: #ffc233; } .site { stroke: #9be36b; } .gate { stroke: #c9ced6; }
    .dev { fill: #3a2430; stroke: #f0a3b9; } .horde { stroke: #d1281c; fill: #200a0a; }
    .small { font-size: 15px; fill: #b9a79a; } .muted { font-style: italic; }
    .mono { font: 13px Menlo, Consolas, monospace; fill: #ffc233; }
    .dev-t { text-anchor: middle; } .red { fill: #ff5a4a; }
    .wire { fill: none; stroke: #ffc233; stroke-width: 2.5; opacity: 0.85; }
    .lockicon { fill: #ffc233; stroke: #ffc233; }
    .bounce { stroke: #d1281c; stroke-width: 3; stroke-dasharray: 6 5; }
    .x { stroke: #ff5a4a; stroke-width: 4; stroke-linecap: round; }
    .invite { stroke: #c9ced6; stroke-width: 2.5; stroke-dasharray: 6 5; }
  </style>
  <rect x="0" y="0" width="1000" height="600" fill="#1a0f16"/>
      <title id="how-title">How a Hogman pen works</title>
      <desc id="how-desc">A fenced pen called smith.hogman. Inside it: the home page, where the keeper invites people and gives the boot; three members' devices (Alice's laptop, Bob's phone, Carol's laptop); and two websites, blog.smith.hogman shared from Alice's laptop with one command, and photos.smith.hogman on a server in Bob's closet. Members reach the websites over encrypted connections. Outside the fence, the horde of strangers and bots can't find or reach anything. The gate, run by us or by you, checks invite links and hands out names and padlocks, but never sees what anyone says.</desc>
      <defs>
        <g id="lock"><rect x="-7" y="-2" width="14" height="11" rx="2"/><path d="M-4.5 -2v-3.5a4.5 4.5 0 0 1 9 0V-2" fill="none" stroke-width="2.4"/></g>
      </defs>
      <!-- the pen -->
      <rect class="pen" x="30" y="40" width="650" height="520" rx="16"/>
      <text class="pen-label" x="54" y="80">YOUR PEN · smith.hogman</text>
      <!-- connections -->
      <path class="wire" d="M250 285 C 340 285, 340 165, 425 165"/>
      <path class="wire" d="M250 365 C 340 365, 340 185, 425 185"/>
      <path class="wire" d="M250 445 C 340 445, 330 425, 425 425"/>
      <path class="wire" d="M250 365 C 340 365, 340 405, 425 405"/>
      <use href="#lock" xlink:href="#lock" class="lockicon" x="332" y="226"/>
      <use href="#lock" xlink:href="#lock" class="lockicon" x="345" y="420"/>
      <!-- home page -->
      <rect class="box home" x="60" y="110" width="220" height="80" rx="8"/>
      <text class="name" x="76" y="142">home.smith.hogman</text>
      <text class="small" x="76" y="168">invites · who's in · the boot</text>
      <!-- devices -->
      <rect class="box dev" x="60" y="262" width="190" height="46" rx="23"/>
      <text class="dev-t" x="155" y="291">alice · laptop</text>
      <rect class="box dev" x="60" y="342" width="190" height="46" rx="23"/>
      <text class="dev-t" x="155" y="371">bob · phone</text>
      <rect class="box dev" x="60" y="422" width="190" height="46" rx="23"/>
      <text class="dev-t" x="155" y="451">carol · laptop</text>
      <text class="small muted" x="60" y="500">Laptops and phones take no visitors.</text>
      <!-- sites -->
      <rect class="box site" x="425" y="130" width="240" height="90" rx="8"/>
      <text class="name" x="441" y="162">blog.smith.hogman</text>
      <text class="small" x="441" y="186">shared from Alice's laptop</text>
      <text class="mono" x="441" y="208">hogman-join share blog 3000</text>
      <rect class="box site" x="425" y="372" width="240" height="90" rx="8"/>
      <text class="name" x="441" y="404">photos.smith.hogman</text>
      <text class="small" x="441" y="428">a little server in</text>
      <text class="small" x="441" y="450">Bob's closet</text>
      <!-- the horde -->
      <rect class="box horde" x="740" y="60" width="230" height="150" rx="8"/>
      <text class="name red" x="760" y="94">THE HORDE</text>
      <text class="small" x="760" y="122">strangers · bots · scrapers</text>
      <text class="small" x="760" y="146">no address to find,</text>
      <text class="small" x="760" y="168">no login page to guess,</text>
      <text class="small" x="760" y="190">no door to knock on</text>
      <path class="bounce" d="M740 250 L 700 250"/>
      <path class="x" d="M688 240 l 16 20 M 704 240 l -16 20"/>
      <!-- the gate -->
      <rect class="box gate" x="740" y="330" width="230" height="200" rx="8"/>
      <text class="name" x="760" y="364">THE GATE</text>
      <text class="small" x="760" y="390">on our server, or yours</text>
      <text class="small" x="760" y="420">checks invite links,</text>
      <text class="small" x="760" y="442">hands out names</text>
      <text class="small" x="760" y="464">and padlocks</text>
      <text class="small" x="760" y="500">never sees what anyone says</text>
      <path class="invite" d="M740 430 L 680 430"/>
    </svg>
